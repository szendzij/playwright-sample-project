name: Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API Tests
        run: npm run test:api

  e2e-and-visual-tests:
    name: E2E & Visual Tests (Docker)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run E2E Tests
        id: e2e
        run: npm run test:e2e -- --grep-invert @visual

      - name: Run Visual ARIA Snapshot Tests
        id: visual
        if: success() || failure()
        run: npm run test:visual

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Generate Job Summary
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          VISUAL_OUTCOME: ${{ steps.visual.outcome }}
        run: |
          format_status() {
            case "$1" in
              success) echo ":white_check_mark: Passed" ;;
              failure) echo ":x: Failed" ;;
              cancelled) echo ":warning: Cancelled" ;;
              skipped) echo ":heavy_minus_sign: Skipped" ;;
              *) echo "$1" ;;
            esac
          }

          E2E_STATUS=$(format_status "$E2E_OUTCOME")
          VISUAL_STATUS=$(format_status "$VISUAL_OUTCOME")

          echo "### 🎭 Playwright Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Target / Mode | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **E2E Scenarios** | Desktop Chromium (Playwright Docker) | $E2E_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Visual Regression** | ARIA Snapshot Trees | $VISUAL_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test run completed in official Playwright Docker container. Download the HTML report from the workflow artifacts above." >> $GITHUB_STEP_SUMMARY

